name: Deploy · Web

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: nexior-web-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Kubectl
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Check for deployable changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_revision=$(kubectl get deployment studio-frontend -n acedatacloud \
            -o jsonpath='{.metadata.annotations.acedata\.cloud/last-successful-revision}' 2>/dev/null || true)
          if ! [[ "$last_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No Studio successful revision; deploying $GITHUB_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$last_revision" = "$GITHUB_SHA" ]; then
            echo "No changes since successful deployment $last_revision"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$last_revision^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$last_revision" || true
          fi
          if ! git cat-file -e "$last_revision^{commit}" 2>/dev/null || \
             ! git merge-base --is-ancestor "$last_revision" "$GITHUB_SHA"; then
            echo "Successful revision cannot be compared safely; deploying $GITHUB_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy=false
          while IFS= read -r path; do
            case "$path" in
              .gitignore | README.md | SECURITY.md | LICENSE | CHANGELOG.md | CHANGELOG.json | docs/* | .vscode/* | .github/ISSUE_TEMPLATE/*) ;;
              *) deploy=true; break ;;
            esac
          done < <(git diff --name-only "$last_revision" "$GITHUB_SHA")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          [ "$deploy" = true ] || echo "Only deploy-ignored files changed since $last_revision"

      - name: Generate Build Number
        if: steps.changes.outputs.deploy == 'true'
        uses: einaregilsson/build-number@v2
        with:
          token: ${{ secrets.github_token }}
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

      - name: Set release tag
        if: steps.changes.outputs.deploy == 'true'
        run: echo "RELEASE_TAG=${BUILD_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Compute Docker Hub version tag
        if: steps.changes.outputs.deploy == 'true'
        id: docker_tag
        run: echo "version=$(date +'%Y.%-m.%-d')-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Lock current production release
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOYMENT: studio-frontend
          SERVICE: studio-frontend
          IMAGE_REPOSITORY: ghcr.io/acedatacloud/studio-frontend
        run: bash deploy/preflight-release.sh

      - name: Prepare previous release assets
        if: steps.changes.outputs.deploy == 'true'
        env:
          MAX_RELEASE_FILES: '4000'
          MAX_RELEASE_BYTES: '268435456'
        run: bash deploy/prepare-previous-assets.sh

      - name: Build and push bridge and final images
        if: steps.changes.outputs.deploy == 'true'
        run: |
          docker buildx build --target bridge --build-arg "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" \
            --tag "ghcr.io/acedatacloud/studio-frontend:${RELEASE_TAG}-bridge" --push \
            --cache-from type=gha --cache-to type=gha,mode=max .
          docker buildx build --target final --build-arg "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" \
            --tag "ghcr.io/acedatacloud/studio-frontend:${RELEASE_TAG}" --push \
            --cache-from type=gha .

      - name: Verify production stayed unchanged during build
        if: steps.changes.outputs.deploy == 'true'
        env:
          EXPECTED_IMAGE: ${{ env.PREVIOUS_IMAGE }}
          EXPECTED_TAGGED_IMAGE: ${{ env.PREVIOUS_TAGGED_IMAGE }}
          DEPLOYMENT: studio-frontend
          SERVICE: studio-frontend
          IMAGE_REPOSITORY: ghcr.io/acedatacloud/studio-frontend
        run: bash deploy/verify-release-unchanged.sh

      - name: Apply and verify compatible rollout
        if: steps.changes.outputs.deploy == 'true'
        run: bash deploy/verify-cutover.sh

      - name: Publish verified final image to Docker Hub
        if: steps.changes.outputs.deploy == 'true'
        run: |
          docker buildx build --target final --build-arg "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" \
            --tag "acedatacloud/nexior:${{ steps.docker_tag.outputs.version }}" \
            --tag acedatacloud/nexior:latest --push --cache-from type=gha .
