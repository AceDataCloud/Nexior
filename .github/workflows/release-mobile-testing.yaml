name: Release · Mobile testing

# Schedule external TestFlight daily. Android's daily production workflow commits
# beta + production together; a separate morning beta review could starve it.
# Manual testing still supports Android through the same review guard.
on:
  schedule:
    # 05:47 Beijing time (UTC 21:47), after the daily asset release window.
    - cron: '47 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mobile-testing-release
  cancel-in-progress: false

jobs:
  android:
    name: Android · Play beta
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-android.yaml
    with:
      upload_to_play: true
      track: beta
      promote_to_production: false
      force: false
    secrets: inherit

  ios:
    name: iOS · External TestFlight
    uses: ./.github/workflows/release-ios.yaml
    with:
      auto_distribute_external: true
      auto_submit_review: false
      force: false
    secrets: inherit
