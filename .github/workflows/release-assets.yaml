name: Release · Assets

# Build every platform into workflow artifacts, then create one public Latest
# Release only after the complete versioned asset set is present.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Beachball tag to assemble.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Beachball tag to assemble (for example @acedatacloud/nexior_v3.360.0).'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build web dist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="@acedatacloud/nexior_v${VERSION}"
          test "$RELEASE_TAG" = "$EXPECTED" || {
            echo "::error::release tag $RELEASE_TAG does not match package version $EXPECTED"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build web dist
        run: npm run build

      - name: Package web dist
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SAFE_TAG=${RELEASE_TAG//\//-}
          ASSET="nexior-dist-${SAFE_TAG}.tar.gz"
          tar -czf "$ASSET" dist
          sha256sum "$ASSET" > "${ASSET}.sha256"

      - name: Upload web release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nexior-release-web-${{ steps.meta.outputs.version }}
          path: |
            nexior-dist-*.tar.gz
            nexior-dist-*.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  desktop:
    name: Build desktop installers
    needs: prepare
    uses: ./.github/workflows/release-desktop.yaml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  android:
    name: Build Android sideload package
    needs: prepare
    uses: ./.github/workflows/release-android.yaml
    with:
      release_tag: ${{ inputs.release_tag }}
      upload_to_play: false
    secrets: inherit

  publish:
    name: Verify assets and publish Latest Release
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nexior-installer-publish
      cancel-in-progress: false
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: nexior-release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete versioned asset set and prepare stable downloads
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#@acedatacloud/nexior_v}
          python3 scripts/prepare_installer_assets.py release-assets "$VERSION"
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Create public Latest Release
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IOS_APP_STORE_URL_OVERRIDE: ${{ vars.IOS_APP_STORE_URL }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already has a GitHub Release; refusing to replace it"
            exit 1
          fi
          LATEST=true
          PUBLISHED_TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          PUBLISHED_VERSION=${PUBLISHED_TAG#@acedatacloud/nexior_v}
          if [ "$(printf '%s\n' "$VERSION" "$PUBLISHED_VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            LATEST=false
            echo "::notice::A newer release is already public; preserving Latest."
          fi
          IOS_URL=${IOS_APP_STORE_URL_OVERRIDE:-}
          if [ -z "$IOS_URL" ]; then
            IOS_URL=$(sed -nE "s/.*MOBILE_IOS_APP_STORE_URL *= *'([^']+)'.*/\1/p" src/constants/mobile.ts | head -n1)
          fi
          cat > release-notes.md <<EOF
          ## 📦 Downloads

          | Platform | How to get it |
          |----------|---------------|
          | 🍎 **macOS** | The \`.dmg\` in Assets below (plain name for Intel, \`arm64\` for Apple Silicon) |
          | 🪟 **Windows** | The \`.exe\` installer in Assets below |
          | 🤖 **Android** | The \`.apk\` in Assets below (sideload), or [Google Play](https://play.google.com/store/apps/details?id=com.acedatacloud.nexior) |
          | 📱 **iOS** | [App Store](${IOS_URL}) |
          | 🌐 **Web** | The \`nexior-dist-*.tar.gz\` below (self-host) |

          > macOS 12+ downloads are Developer ID signed and Apple notarized. Windows signing status is reported by the installer.
          > Stable download filenames always resolve through the latest complete Release. SHA256SUMS covers every download.
          EOF
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --notes-file release-notes.md \
            --title "v$VERSION" --latest=false release-assets/*
          # Do not move stable links until every upload has completed.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets > uploaded-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('release-assets').iterdir()}
          actual = {a['name']: a['size'] for a in json.loads(Path('uploaded-assets.json').read_text())['assets']}
          if actual != expected:
              raise SystemExit('Uploaded release assets do not match the verified local set')
          PY
          if [ "$LATEST" = true ]; then
            gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --latest
          fi
