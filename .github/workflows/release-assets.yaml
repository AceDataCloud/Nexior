name: Release · Assets

# Build every platform into workflow artifacts, then create one public Latest
# Release only after the complete versioned asset set is present.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Beachball tag to assemble.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Beachball tag to assemble (for example @acedatacloud/nexior_v3.360.0).'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build web dist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="@acedatacloud/nexior_v${VERSION}"
          test "$RELEASE_TAG" = "$EXPECTED" || {
            echo "::error::release tag $RELEASE_TAG does not match package version $EXPECTED"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build web dist
        run: npm run build

      - name: Package web dist
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SAFE_TAG=${RELEASE_TAG//\//-}
          ASSET="nexior-dist-${SAFE_TAG}.tar.gz"
          tar -czf "$ASSET" dist
          sha256sum "$ASSET" > "${ASSET}.sha256"

      - name: Upload web release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nexior-release-web-${{ steps.meta.outputs.version }}
          path: |
            nexior-dist-*.tar.gz
            nexior-dist-*.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  desktop:
    name: Build desktop installers
    needs: prepare
    uses: ./.github/workflows/release-desktop.yaml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  android:
    name: Build Android sideload package
    needs: prepare
    uses: ./.github/workflows/release-android.yaml
    with:
      release_tag: ${{ inputs.release_tag }}
      upload_to_play: false
    secrets: inherit

  publish:
    name: Verify assets and publish Latest Release
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: nexior-release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete versioned asset set
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#@acedatacloud/nexior_v}
          find release-assets -maxdepth 1 -type f -print
          for EXPECTED in \
            "nexior-dist-@acedatacloud-nexior_v${VERSION}.tar.gz" \
            "nexior-dist-@acedatacloud-nexior_v${VERSION}.tar.gz.sha256" \
            "nexior-${VERSION}.apk" \
            "AceData.Setup.${VERSION}.exe" \
            "AceData-${VERSION}.dmg" \
            "AceData-${VERSION}-arm64.dmg"; do
            test "$(find release-assets -maxdepth 1 -type f -name "$EXPECTED" | wc -l | tr -d ' ')" = "1" || {
              echo "::error::expected exactly one $EXPECTED"
              exit 1
            }
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "6" || {
            echo "::error::unexpected files in the release asset set"
            exit 1
          }

      - name: Create public Latest Release
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IOS_APP_STORE_URL_OVERRIDE: ${{ vars.IOS_APP_STORE_URL }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already has a GitHub Release; refusing to replace it"
            exit 1
          fi
          IOS_URL=${IOS_APP_STORE_URL_OVERRIDE:-}
          if [ -z "$IOS_URL" ]; then
            IOS_URL=$(sed -nE "s/.*MOBILE_IOS_APP_STORE_URL *= *'([^']+)'.*/\1/p" src/constants/mobile.ts | head -n1)
          fi
          cat > release-notes.md <<EOF
          ## 📦 Downloads

          | Platform | How to get it |
          |----------|---------------|
          | 🍎 **macOS** | The \`.dmg\` in Assets below (plain name for Intel, \`arm64\` for Apple Silicon) |
          | 🪟 **Windows** | The \`.exe\` installer in Assets below |
          | 🤖 **Android** | The \`.apk\` in Assets below (sideload), or [Google Play](https://play.google.com/store/apps/details?id=com.acedatacloud.nexior) |
          | 📱 **iOS** | [App Store](${IOS_URL}) |
          | 🌐 **Web** | The \`nexior-dist-*.tar.gz\` below (self-host) |

          > macOS downloads are Developer ID signed and Apple notarized.
          EOF
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --notes-file release-notes.md \
            --title "v$VERSION" --latest release-assets/*
