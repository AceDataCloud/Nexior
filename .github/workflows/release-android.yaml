name: Release · Android

on:
  push:
    tags:
      - 'android-v*'
  workflow_call:
    outputs:
      submitted:
        description: 'Whether this run sent a release for review.'
        value: ${{ jobs.publish.outputs.submitted }}
      reason:
        description: 'Google Play review/submission decision.'
        value: ${{ jobs.publish.outputs.reason || jobs.preflight.outputs.reason }}
    inputs:
      dry_run:
        description: 'Read Play review state without building or submitting.'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Optional Release tag whose source is being packaged.'
        required: false
        default: ''
        type: string
      upload_to_play:
        description: 'Upload the AAB to Google Play.'
        required: false
        default: false
        type: boolean
      track:
        description: 'Initial Google Play track.'
        required: false
        default: 'beta'
        type: string
      promote_to_production:
        description: 'Promote the version from the initial track to Production.'
        required: false
        default: false
        type: boolean
      rollout_percent:
        description: 'Production staged rollout fraction (0.0–1.0).'
        required: false
        default: '1.0'
        type: string
      force:
        description: 'Legacy input; existing version codes are reused and active reviews are never bypassed.'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read Play review state without building or submitting.'
        required: false
        default: false
        type: boolean
      track:
        description: 'Initial Play Store track to upload to (default: beta = Open testing)'
        required: true
        default: 'beta'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      promote_to_production:
        description: 'Auto-promote the same versionCode to Production after the initial upload succeeds.'
        required: false
        default: false
        type: boolean
      rollout_percent:
        description: 'Production staged rollout fraction (0.0–1.0). 1.0 = full release.'
        required: false
        default: '1.0'
        type: string
      force:
        description: 'Legacy input; existing version codes are reused and active reviews are never bypassed.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # All store entry points share one lock, including the build-to-commit interval.
  # Package-only GitHub Release builds never reserve the Play submission lock.
  group: ${{ (inputs.upload_to_play || startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')) && 'android-play-store-release' || format('android-package-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  preflight:
    name: Check Play review lifecycle and version
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.package_only.outputs.should-build || steps.check.outputs.should-build }}
      should-submit: ${{ steps.check.outputs.should-submit }}
      play-enabled: ${{ steps.mode.outputs.play-enabled }}
      reason: ${{ steps.check.outputs.reason }}
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      track: ${{ steps.track.outputs.track }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Determine version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$VERSION"
          CODE=$((major * 10000 + minor * 100 + patch))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"   >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Code: $CODE"

      - name: Determine Play Store track
        id: track
        env:
          INPUT_TRACK: ${{ inputs.track }}
        run: echo "track=${INPUT_TRACK:-beta}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve store release mode
        id: mode
        env:
          PLAY_ENABLED: ${{ inputs.upload_to_play || startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') }}
        run: echo "play-enabled=$PLAY_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Build without Play preflight
        if: steps.mode.outputs.play-enabled != 'true'
        run: echo "should-build=true" >> "$GITHUB_OUTPUT"
        id: package_only

      - name: Check review lifecycle across all Play tracks
        id: check
        if: steps.mode.outputs.play-enabled == 'true'
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.acedatacloud.nexior
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAY_TRACK: ${{ steps.track.outputs.track }}
          PROMOTE: ${{ inputs.promote_to_production || startsWith(github.ref, 'refs/tags/android-v') }}
          ANDROID_POLICY_HOLD: ${{ vars.ANDROID_POLICY_HOLD }}
          ROLLOUT: ${{ inputs.rollout_percent || '1.0' }}
        # Errors fail closed. force/bypass_gate never bypass an active review.
        run: |
          python3 -m pip install --quiet 'pyjwt[crypto]==2.10.1' requests
          python3 scripts/play_release.py check

  build:
    name: Build Android package
    needs: preflight
    if: needs.preflight.outputs.should-build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets (full flavor, Computer Use ON)
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build:android

      - name: Sync Android project
        run: npx cap sync android

      - name: Stage full-flavor web assets
        # cap sync copied the full (Computer Use ON) web build into the shared
        # main source set. Move it into the `full` flavor so only the sideload
        # APK carries Computer Use. capacitor.config.json etc. stay in main.
        run: |
          mkdir -p android/app/src/full/assets
          rm -rf android/app/src/full/assets/public
          mv android/app/src/main/assets/public android/app/src/full/assets/public

      - name: Build web assets (play flavor, Computer Use OFF, tree-shaken)
        if: needs.preflight.outputs.play-enabled == 'true'
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_COMPUTER_USE: 'false'
          VITE_PLAY_BUILD: 'true'
        run: npm run build:android

      - name: Stage play-flavor web assets
        if: needs.preflight.outputs.play-enabled == 'true'
        # The Play web bundle is compiled with no Local Tools entry and no
        # Computer Use / AccessibilityService adapter code; it lives only in the
        # `play` flavor. cap copy re-processes dist into the main source set the
        # same way as the full build, then we move it into `play`.
        run: |
          npx cap copy android
          mkdir -p android/app/src/play/assets
          rm -rf android/app/src/play/assets/public
          mv android/app/src/main/assets/public android/app/src/play/assets/public

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        shell: bash

      - name: Set version in build.gradle
        env:
          VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
          VERSION_CODE: ${{ needs.preflight.outputs.version-code }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
        shell: bash

      - name: Build Play AAB (play flavor, no Computer Use)
        if: needs.preflight.outputs.play-enabled == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundlePlayRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PRELEASE_KEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PRELEASE_KEY_PASSWORD='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Build full APK (full flavor, sideload + Computer Use)
        working-directory: android
        run: |
          ./gradlew assembleFullRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PRELEASE_KEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PRELEASE_KEY_PASSWORD='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Verify release APK identity and signature
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version-name }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/full/release/app-full-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.acedatacloud.nexior'" | grep -F "versionName='$EXPECTED_VERSION'"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > apk-signature.txt
          if grep -qi 'CN=Android Debug' apk-signature.txt; then
            echo "::error::Refusing to publish a debug-signed APK"
            exit 1
          fi

      - name: Stage versioned APK
        if: inputs.release_tag != ''
        run: cp android/app/build/outputs/apk/full/release/app-full-release.apk "nexior-${{ needs.preflight.outputs.version-name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_tag != '' && format('nexior-release-android-{0}', needs.preflight.outputs.version-name) || format('nexior-{0}.apk', needs.preflight.outputs.version-name) }}
          path: ${{ inputs.release_tag != '' && format('nexior-{0}.apk', needs.preflight.outputs.version-name) || 'android/app/build/outputs/apk/full/release/app-full-release.apk' }}
          if-no-files-found: error

      - name: Upload AAB artifact
        if: needs.preflight.outputs.play-enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nexior-${{ needs.preflight.outputs.version-name }}.aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab

  publish:
    name: Submit Play release (one review)
    needs: [preflight, build]
    if: >-
      always() && !cancelled() && !inputs.dry_run
      && needs.preflight.result == 'success'
      && needs.preflight.outputs.should-submit == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      submitted: ${{ steps.publish.outputs.submitted }}
      reason: ${{ steps.publish.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download Play AAB
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: nexior-${{ needs.preflight.outputs.version-name }}.aab
          path: play-artifact

      - name: Recheck review state and commit testing plus production together
        id: publish
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.acedatacloud.nexior
          VERSION_CODE: ${{ needs.preflight.outputs.version-code }}
          VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
          PLAY_TRACK: ${{ needs.preflight.outputs.track }}
          PROMOTE: ${{ inputs.promote_to_production || startsWith(github.ref, 'refs/tags/android-v') }}
          ANDROID_POLICY_HOLD: ${{ vars.ANDROID_POLICY_HOLD }}
          ROLLOUT: ${{ inputs.rollout_percent || '1.0' }}
          CHANGES_NOT_SENT_FOR_REVIEW: ${{ vars.ANDROID_CHANGES_NOT_SENT_FOR_REVIEW }}
          AAB_PATH: play-artifact/app-play-release.aab
        run: |
          python3 -m pip install --quiet 'pyjwt[crypto]==2.10.1' requests
          python3 scripts/play_release.py publish
